services:
  db:
    image: mysql:8.0
    container_name: style_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-framework_style}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sandro}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: style_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-sandro}@db:3306/${MYSQL_DATABASE:-framework_style}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  mysql_data:
